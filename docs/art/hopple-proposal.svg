<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350" role="img" aria-label="Proposed Hopple: an ivory bunny with a folded ear, plum eyes, pink paws, and rounded cheeks">
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fffdf8"/><stop offset=".65" stop-color="#fff9ee"/><stop offset="1" stop-color="#eadfd5"/></linearGradient>
 <linearGradient id="pink" x2=".5" y2="1"><stop stop-color="#ffd5d6"/><stop offset="1" stop-color="#eea5b6"/></linearGradient>
 <linearGradient id="eye" x2="0" y2="1"><stop stop-color="#392e58"/><stop offset="1" stop-color="#685084"/></linearGradient>
</defs>
<ellipse cx="163" cy="327" rx="89" ry="12" fill="#b8a6ba" opacity=".17"/>
<g stroke="#897285" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
