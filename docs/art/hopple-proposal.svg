 <ellipse cx="117" cy="166" rx="5" ry="6" fill="#fff" stroke="none"/>
 <ellipse cx="189" cy="166" rx="5" ry="6" fill="#fff" stroke="none"/>
 <circle cx="128" cy="181" r="2.5" fill="#cfbde5" stroke="none"/>
 <circle cx="200" cy="181" r="2.5" fill="#cfbde5" stroke="none"/>
 <ellipse cx="103" cy="199" rx="15" ry="8" fill="#f3b3bc" opacity=".55" stroke="none"/>
 <ellipse cx="215" cy="199" rx="15" ry="8" fill="#f3b3bc" opacity=".55" stroke="none"/>
 <path d="M151 195q9-5 18 0c1 7-7 12-9 12s-10-5-9-12Z" fill="#dd8fa5" stroke="none"/>
 <path d="M160 207v4c-2 10-14 11-19 4m19-4c3 10 14 11 19 4" fill="none" stroke="#897285" stroke-width="2.7"/>
